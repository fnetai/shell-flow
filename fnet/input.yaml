$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  commands:
    description: Command string or array of commands or command groups to execute.
    type: array
    items:
      oneOf:
        - type: string
        - $ref: "#/$defs/commandGroup"
  fork:
    description: Forked command string or array of commands or command groups to execute.
    type: array
    items:
      oneOf:
        - type: string
        - $ref: "#/$defs/commandGroup"
  parallel:
    description: Parallel command string or array of commands or command groups to execute.
    type: array
    items:
      oneOf:
        - type: string
        - $ref: "#/$defs/commandGroup"
  onError:
    type: string
    default: "stop"
    enum: ["stop", "continue", "log"]
    description: |
      Global error handling policy: "stop", "continue", or "log".
  env:
    type: object
    additionalProperties: true
    description: Environment variables.
  wdir:
    type: string
    description: Working directory.
# Enforce that exactly one of commands, fork, or parallel is provided.
oneOf:
  - required: ["commands"]
    not:
      anyOf:
        - required: ["fork"]
        - required: ["parallel"]
  - required: ["fork"]
    not:
      anyOf:
        - required: ["commands"]
        - required: ["parallel"]
  - required: ["parallel"]
    not:
      anyOf:
        - required: ["commands"]
        - required: ["fork"]
$defs:
  commandGroup:
    type: object
    additionalProperties: false
    properties:
      steps:
        type: array
        items:
          oneOf:
            - type: string
            - $ref: "#/$defs/commandGroup"
        description: Array of commands to execute sequentially in steps.
      parallel:
        type: array
        items:
          oneOf:
            - type: string
            - $ref: "#/$defs/commandGroup"
        description: Array of commands to execute in parallel.
      fork:
        type: array
        items:
          oneOf:
            - type: string
            - $ref: "#/$defs/commandGroup"
        description: Array of commands to execute in fork.
      env:
        type: object
        additionalProperties: true
        description: Environment variables for the command group.
      wdir:
        type: string
        description: Working directory for the command group.
      onError:
        type: string
        enum: ["stop", "continue", "log"]
        description: Error handling policy for this command group.
      useScript:
        type: boolean
        default: false
        description: |
          If true, steps commands in this group are executed via a temporary script file. 
          Ignored for parallel and fork.
      captureName:
        type: string
        description: |
          If set, the output of the command group is captured and stored with this name.
          Ignored for parallel and fork.
    oneOf:
      - required: ["steps"]
      - required: ["parallel"]
      - required: ["fork"]
