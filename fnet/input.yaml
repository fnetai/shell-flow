$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  commands:
    description: Command string or array of commands or command groups to execute.
    oneOf:
      - type: string
      - type: array
        items:
          oneOf:
            - type: string
            - type: object
              properties:
                parallel:
                  type: array
                  items:
                    type: string
                onError:
                  type: string
                  enum: ["stop", "continue"]
                  description: Error handling policy for parallel commands.
              required:
                - parallel
            - type: object
              properties:
                fork:
                  type: array
                  items:
                    type: string
                onError:
                  type: string
                  enum: ["log", "notifyParent"]
                  description: Error handling policy for forked commands.
              required:
                - fork
  onError:
    type: string
    enum: ["stop", "continue", "log"]
    default: "stop"
    description: |
      Error handling policy: "stop", "continue", or "log".
required:
  - commands