$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  commands:
    description: Command string or array of commands or command groups to execute.
    oneOf:
      - type: string
      - type: array
        items:
          oneOf:
            - type: string
            - type: object
              additionalProperties: false
              properties:
                parallel:
                  type: array
                  items: 
                    type: string
                  description: Array of commands to execute in parallel.
                fork:
                  type: array
                  items:
                    type: string
                  description: Array of commands to execute in fork.
                onError:
                  type: string
                  enum: ["stop", "continue", "log"]
                  description: |
                    Error handling policy:
                    "stop" - Stop execution on error,
                    "continue" - Continue execution on error,
                    "log" - Log error and continue.
  onError:
    type: string
    default: "stop"
    enum: ["stop", "continue", "log"]
    description: |
      Global error handling policy:
      "stop" - Stop execution on error,
      "continue" - Continue execution on error,
      "log" - Log error and continue.
required:
  - commands