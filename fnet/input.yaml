$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  commands:
    description: Sequential commands to execute
    type: array
    items:
      oneOf:
        - type: string
        - type: object
          properties:
            echo:
              type: string
              description: Message to output
            sleep:
              oneOf:
                - type: number
                - type: string
              description: Time to sleep in seconds
            exit:
              oneOf:
                - type: integer
                  minimum: 0
                  maximum: 127
                - type: string
              description: Exit code (0-127)
            filemap:
              $ref: "#/$defs/filemapConfig"
              description: Filemap configuration object
            fork:
              oneOf:
                - type: string
                - type: array
                  items:
                    oneOf:
                      - type: string
                      - $ref: "#/$defs/commandGroup"
            steps:
              type: array
              items:
                oneOf:
                  - type: string
                  - $ref: "#/$defs/commandGroup"
            parallel:
              oneOf:
                - type: string
                - type: array
                  items:
                    oneOf:
                      - type: string
                      - $ref: "#/$defs/commandGroup"
            onError:
              type: string
              enum: ["stop", "continue", "log", "throw"]
            env:
              type: object
              additionalProperties: true
            wdir:
              type: string
            captureName:
              type: string
            retry:
              oneOf:
                - type: boolean
                - type: object
                  properties:
                    attempts:
                      type: integer
                      minimum: 1
                    delay:
                      type: integer
                      minimum: 0
                    factor:
                      type: number
                      minimum: 1
                    maxDelay:
                      type: integer
                      minimum: 0
                    codes:
                      type: array
                      items:
                        type: integer
                  additionalProperties: false
          oneOf:
            - required: ["echo"]
            - required: ["sleep"]
            - required: ["exit"]
            - required: ["filemap"]
            - required: ["steps"]
            - required: ["parallel"]
            - required: ["fork"]
          additionalProperties: true
  fork:
    description: Commands to execute in background
    type: array
    items:
      oneOf:
        - type: string
        - $ref: "#/$defs/commandGroup"
  parallel:
    description: Commands to execute in parallel
    type: array
    items:
      oneOf:
        - type: string
        - $ref: "#/$defs/commandGroup"
  onError:
    type: string
    default: "stop"
    enum: ["stop", "continue", "log", "throw"]
    description: Global error handling policy
  env:
    type: object
    additionalProperties: true
    description: Global environment variables
  wdir:
    type: string
    description: Global working directory
  context:
    type: object
    additionalProperties: true
    description: Template context object for variable substitution
  retry:
    oneOf:
      - type: boolean
      - type: object
        properties:
          attempts:
            type: integer
            minimum: 1
          delay:
            type: integer
            minimum: 0
          factor:
            type: number
            minimum: 1
          maxDelay:
            type: integer
            minimum: 0
          codes:
            type: array
            items:
              type: integer
        additionalProperties: false
    description: Global retry configuration

oneOf:
  - required: ["commands"]
    not:
      anyOf:
        - required: ["fork"]
        - required: ["parallel"]
  - required: ["fork"]
    not:
      anyOf:
        - required: ["commands"]
        - required: ["parallel"]
  - required: ["parallel"]
    not:
      anyOf:
        - required: ["commands"]
        - required: ["fork"]

$defs:
  filemapSource:
    type: object
    properties:
      source:
        type: string
        description: "The source from which to fetch files, supports multiple protocols and providers."
      target:
        type: string
        description: "Optional target subdirectory within the main target directory for output."
      context:
        type: object
        description: "Context data to be used with the templating engine for dynamic content rendering."
      engine:
        type: string
        default: "njk"
        description: "Template engine to use, defaults to 'njk' (Nunjucks)."
      symlink:
        type: boolean
        default: false
        description: "Determines whether to create symbolic links instead of copying files."
      provider:
        type: object
        description: "Custom provider configurations that can override defaults."
    required:
      - source

  filemapConfig:
    type: object
    properties:
      target:
        type: string
        description: "The target directory path where processed files will be placed."
      sources:
        type: array
        items:
          $ref: "#/$defs/filemapSource"
      output:
        type: string
        default: "file"
        description: "Output format; options include 'file', 'stdout', or 'json'."
      provider:
        type: object
        description: "Default provider configurations for various source types."
    required:
      - target
      - sources

  commandGroup:
    type: object
    additionalProperties: true
    properties:
      steps:
        type: array
        items:
          oneOf:
            - type: string
            - $ref: "#/$defs/commandGroup"
        description: Array of sequential commands
      parallel:
        type: array
        items:
          oneOf:
            - type: string
            - $ref: "#/$defs/commandGroup"
        description: Array of parallel commands
      fork:
        type: array
        items:
          oneOf:
            - type: string
            - $ref: "#/$defs/commandGroup"
        description: Array of background commands
      filemap:
        $ref: "#/$defs/filemapConfig"
        description: Filemap configuration object
      env:
        type: object
        additionalProperties: true
        description: Environment variables for the command group
      wdir:
        type: string
        description: Working directory for the command group
      onError:
        type: string
        enum: ["stop", "continue", "log", "throw"]
        description: Error handling policy for this command group
      useScript:
        type: boolean
        default: false
        description: Whether to execute commands in a script file
      captureName:
        type: string
        description: Name to capture command output
      retry:
        oneOf:
          - type: boolean
          - type: object
            properties:
              attempts:
                type: integer
                minimum: 1
              delay:
                type: integer
                minimum: 0
              factor:
                type: number
                minimum: 1
              maxDelay:
                type: integer
                minimum: 0
              codes:
                type: array
                items:
                  type: integer
            additionalProperties: false
        description: Retry configuration for this command group
    oneOf:
      - required: ["steps"]
      - required: ["parallel"]
      - required: ["fork"]
      - required: ["filemap"]
examples:
  - description: Sequential command execution with error handling
    value:
      commands:
        - "echo 'Starting deployment'"
        - steps:
            - "npm install"
            - "npm run build"
            - "npm run test"
          onError: "stop"
          captureName: "build_output"
      onError: "stop"
      env:
        NODE_ENV: "production"
      wdir: "./app"

  - description: Parallel execution of multiple tasks
    value:
      parallel:
        - "npm run test:unit"
        - "npm run test:integration"
        - steps:
            - "npm run lint"
            - "npm run type-check"
          captureName: "code_quality"
      onError: "continue"
      env:
        CI: "true"

  - description: Background tasks with fork
    value:
      fork:
        - "npm run watch:css"
        - "npm run watch:js"
        - steps:
            - "echo 'Starting dev server'"
            - "npm run dev"
          env:
            PORT: "3000"
      onError: "log"

  - description: Complex nested structure
    value:
      commands:
        - "echo 'Starting pipeline'"
        - parallel:
            - steps:
                - "npm install"
                - "npm run build"
              captureName: "build_output"
              useScript: true
            - fork:
                - "npm run watch"
                - "npm run test:watch"
        - steps:
            - "docker build -t myapp ."
            - "docker push myapp"
          onError: "throw"
          env:
            DOCKER_BUILDKIT: "1"
      wdir: "/project/root"
      env:
        NODE_ENV: "development"

  - description: Script-based execution with capture
    value:
      commands:
        - steps:
            - "set -e"
            - "echo 'Preparing environment'"
            - "npm ci"
            - "npm run build"
          useScript: true
          captureName: "build_log"
          env:
            NODE_ENV: "production"
      onError: "stop"

  - description: Error handling demonstration
    value:
      parallel:
        - steps:
            - "echo 'Task 1'"
            - "invalid-command-1"
          onError: "continue"
        - steps:
            - "echo 'Task 2'"
            - "invalid-command-2"
          onError: "log"
        - steps:
            - "echo 'Task 3'"
            - "exit 1"
          onError: "throw"
      onError: "stop"

  - description: Control commands example
    value:
      commands:
        - echo: "Starting deployment"
        - sleep: 2
        - echo: "Environment: {{env}}"
        - steps:
            - "npm install"
            - "npm run build"
          onError: "stop"
        - exit: "{{success ? 0 : 1}}"
      context:
        env: "production"
        success: true

  - description: Filemap command example
    value:
      commands:
        - echo: "Starting file mapping"
        - filemap:
            target: "dist"
            sources:
              - source: "templates"
                target: "."
                symlink: false
              - source: "assets"
                target: "assets"
                symlink: true
        - echo: "File mapping completed"
      context:
        app:
          name: "My App"
          version: "1.0.0"
