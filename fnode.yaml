name: shell-flow

ai::name: "@fnet/shell-flow"
s::repo.url: https://github.com/fnetai/shell-flow.git

features:
  s::runtime.type: bun

  dts: true
  app: false
  cli: false

  t::dev::cli: true

commands:
  dev:
    description: Build with dev tag and start dev CLI
    usage: frun dev
    steps:
      - fnode build -ftag dev
      - fnode cli:dev

  node-deploy:
    description: Deploy package to npm
    usage: frun node-deploy
    steps:
      - fnode deploy

  prepare-simple-server:
    description: Build and compile the simple-server test helper
    usage: frun prepare-simple-server
    wdir: tests/simple-server
    steps:
      - fnode build
      - fnode cli:compile
      - ./.workspace/.bin/simple-server --help

  # === Test Categories ===

  test-basic:
    description: Simple commands and script mode tests
    usage: frun test-basic
    steps:
      - fnode cli --config basic-01-simple-commands
      - fnode cli --config basic-02-script-mode

  test-builtin:
    description: Echo and sleep builtin tests
    usage: frun test-builtin
    steps:
      - fnode cli --config builtin-01-echo
      - fnode cli --config builtin-02-sleep

  test-template:
    description: Template variable resolution tests (required and advanced)
    usage: frun test-template
    steps:
      - fnode cli --config template-01-required
      - fnode cli --config template-02-advanced

  test-parallel:
    description: Parallel, fork, and nested parallel execution tests
    usage: frun test-parallel
    steps:
      - fnode cli --config parallel-01-simple
      - fnode cli --config parallel-02-fork
      - fnode cli --config parallel-03-nested

  test-error:
    description: Error handling policy tests (stop, continue, capture)
    usage: frun test-error
    steps:
      - fnode cli --config error-01-stop || true
      - fnode cli --config error-02-continue
      - fnode cli --config error-03-continue-capture

  test-retry:
    description: Retry mechanism tests (simple, configured, global)
    usage: frun test-retry
    steps:
      - fnode cli --config retry-01-simple
      - fnode cli --config retry-02-configured
      - fnode cli --config retry-03-global

  test-env:
    description: Environment variable and working directory tests
    usage: frun test-env
    steps:
      - fnode cli --config env-01-wdir
      - fnode cli --config env-02-variables

  test-control:
    description: Exit command and exit template control flow tests
    usage: frun test-control
    steps:
      - fnode cli --config control-01-exit || true
      - fnode cli --config control-02-exit-template || true

  test-when:
    description: Conditional execution tests (when with truthy, equal, not, contains, exists, numeric)
    usage: frun test-when
    steps:
      - fnode cli --config control-12-when
      - fnode cli --config control-13-when-advanced

  test-timeout:
    description: Timeout option tests (time limits and timeout+retry combination)
    usage: frun test-timeout
    steps:
      - fnode cli --config control-10-timeout
      - fnode cli --config control-11-timeout-retry

  test-process-control:
    description: Manual process termination tests (requires user interaction)
    usage: frun test-process-control
    steps:
      - echo "=== Process Control Tests ==="
      - echo ""
      - echo "Test 6.1: Signal handling (CTRL+C)"
      - echo "  Run: fnode cli --config control-06-signal-handling"
      - echo "  Then press CTRL+C and verify all processes terminate"
      - echo ""
      - echo "Test 6.2: Complete termination with exit command"
      - echo "  Run: fnode cli --config control-07-complete-termination"
      - echo "  Verify all background processes terminate on exit"
      - echo ""
      - echo "Test 6.3: Nested CTRL+C test"
      - echo "  Run: fnode cli --config test-ctrl-c-nested"
      - echo "  Then press CTRL+C and verify all nested processes terminate"
      - echo ""
      - echo "Test 6.4: HTTP servers with proper termination"
      - echo "  Run: fnode cli --config control-08-http-servers"
      - echo "  Verify HTTP servers are properly terminated on exit"
      - echo ""
      - echo "Test 6.5: HTTP servers with error handling"
      - echo "  Run: fnode cli --config control-09-http-servers-error"
      - echo "  Verify HTTP servers are properly terminated on error"
      - echo ""
      - echo "To verify cleanup after each test:"
      - echo "  ps aux | grep -E '(sleep|node|bun)' | grep -v grep"

  test-expression:
    description: Expression syntax tests (capture, retry, composable, json, each, pipe)
    usage: frun test-expression
    steps:
      - fnode cli --config expression-01-capture
      - fnode cli --config expression-02-retry
      - fnode cli --config expression-03-composable
      - fnode cli --config expression-04-json
      - fnode cli --config expression-05-each
      - fnode cli --config expression-08-pipe
      - fnode cli --config expression-09-pipe-builtins

  test-txt:
    description: Text transformation builtin tests (upper, lower, trim, replace, split, join)
    usage: frun test-txt
    steps:
      - fnode cli --config builtin-05-txt

  test-file:
    description: File operation builtin tests (read, write, delete, copy, list)
    usage: frun test-file
    steps:
      - fnode cli --config builtin-06-file

  test-http:
    description: HTTP request builtin tests (GET, POST, PUT, DELETE)
    usage: frun test-http
    steps:
      - fnode cli --config builtin-07-http

  test-encode:
    description: Encoding and hashing builtin tests (base64, URL, SHA256, MD5)
    usage: frun test-encode
    steps:
      - fnode cli --config builtin-08-encode

  test-time:
    description: Time operation builtin tests (now, format, parse, add, diff)
    usage: frun test-time
    steps:
      - fnode cli --config builtin-09-time

  test-assert:
    description: Assert builtin and expression tests (equal, contains, exists, numeric)
    usage: frun test-assert
    steps:
      - fnode cli --config builtin-10-assert
      - fnode cli --config expression-06-assert

  test-env-builtin:
    description: Environment variable builtin and expression tests (get, set, exists, list, delete)
    usage: frun test-env-builtin
    steps:
      - fnode cli --config builtin-11-env
      - fnode cli --config expression-07-env

  test-exitcode:
    description: Exit code propagation and validation tests
    usage: frun test-exitcode
    steps:
      - fnode cli --config test-exitcode
      - fnode cli --config test-exitcode-error || true
      - fnode cli --config test-exitcode-manual || true

  test-complex:
    description: Complex mixed-mode execution and full feature integration tests
    usage: frun test-complex
    steps:
      - fnode cli --config complex-01-mixed-execution
      - fnode cli --config complex-02-full-features

  # === Interactive Tests (require user input / CTRL+C) ===

  test-interactive:
    description: Interactive pause builtin test (requires user input)
    usage: frun test-interactive
    steps:
      - fnode cli --config builtin-03-pause

  test-signal:
    description: Signal cleanup tests (requires CTRL+C)
    usage: frun test-signal
    steps:
      - echo "=== Signal Cleanup Tests ==="
      - echo ""
      - echo "Test 1: Normal (sequential) — single server"
      - echo "  Run: fnode cli --config signal-01-normal"
      - echo "  Then press CTRL+C and verify server terminates"
      - echo ""
      - echo "Test 2: Fork — 3 servers (graceful, no-handler, long-running)"
      - echo "  Run: fnode cli --config signal-02-fork"
      - echo "  Then press CTRL+C and verify ALL 3 servers terminate"
      - echo ""
      - echo "Test 3: Parallel — 3 servers (graceful, no-handler, long-running)"
      - echo "  Run: fnode cli --config signal-03-parallel"
      - echo "  Then press CTRL+C and verify ALL 3 servers terminate"
      - echo ""
      - echo "After each test, verify no zombie processes:"
      - echo "  curl http://localhost:4001 # should fail"
      - echo "  curl http://localhost:4002 # should fail"
      - echo "  curl http://localhost:4003 # should fail"

  # === Tests that throw errors (run separately) ===

  test-throw:
    description: Error throw policy test (errors re-thrown to caller)
    usage: frun test-throw
    steps:
      - fnode cli --config error-04-throw

  # === Run All Automated Tests ===

  test-all:
    description: Run all automated test categories
    usage: frun test-all
    steps:
      - frun test-basic
      - frun test-builtin
      - frun test-template
      - frun test-parallel
      - frun test-error
      - frun test-retry
      - frun test-env
      - frun test-control
      - frun test-expression
      - frun test-txt
      - frun test-file
      - frun test-http
      - frun test-encode
      - frun test-time
      - frun test-assert
      - frun test-env-builtin
      - frun test-when
      - frun test-timeout
      - frun test-exitcode
      - frun test-complex